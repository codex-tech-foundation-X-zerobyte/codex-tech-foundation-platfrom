<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>Codex Tech Foundation — Engineering, applied.</title>
    <meta name="description" content="Codex Tech Foundation designs and builds digital products, business systems, developer tools, and intelligent platforms that turn complex operations into reliable software." />

    <!--
      Reverses the redirect from 404.html (GitHub Pages only — Vercel never
      hits 404.html since vercel.json handles routing server-side, so this
      script is a silent no-op there). Must run before React Router
      initializes, which is why it's inline in <head> rather than in
      main.tsx. See public/404.html for the encode side of this.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function () {
        var search = window.location.search
        if (search[1] !== '/') return
        var segments = search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') })
        var path = segments.shift()
        var newSearch = segments.length ? '?' + segments.join('&') : ''
        var newPathname = window.location.pathname.replace(/\/$/, '') + path
        window.history.replaceState(null, '', newPathname + newSearch + window.location.hash)
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codex Tech Foundation" />
    <meta property="og:description" content="We build the systems behind ambitious ideas." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- TODO(next phase): og:image, twitter:image, and canonical URL once a production domain and social share image exist. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
